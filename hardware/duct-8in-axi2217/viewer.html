<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pusher Duct Viewer</title>
<style>
  :root { --bg:#f4f6f7; --ink:#10171b; --ink-2:#46545c; --panel:#ffffffdd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111619; --ink:#e6ecef; --ink-2:#a3b1b8; --panel:#1b2226dd; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.4 "IBM Plex Sans", "DejaVu Sans", Arial, sans-serif; }
  #c { position:fixed; inset:0; }
  .panel { position:fixed; top:12px; left:12px; max-width:min(330px, calc(100vw - 24px)); background:var(--panel);
           padding:10px 12px; border-radius:8px; box-shadow:0 2px 10px #0002; }
  h1 { font-size:15px; margin:0 0 6px; }
  .dim { font-family:"IBM Plex Mono", "DejaVu Sans Mono", monospace; font-size:11.5px; color:var(--ink-2); margin:0 0 8px; white-space:pre; overflow-x:auto; }
  label { display:block; margin:3px 0; cursor:pointer; }
  .hint { font-size:11px; color:var(--ink-2); margin-top:6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <h1>Pusher duct — APC 8x4.5MRP on AXI 2217/12</h1>
  <div class="dim" id="dims"></div>
  <label><input type="checkbox" id="cut" checked> cut away a quarter</label>
  <label><input type="checkbox" id="prop" checked> propeller disc</label>
  <label><input type="checkbox" id="spider" checked> spider, motor (Ø27.7 × 35), stand plate (placeholder), M3 bolts</label>
  <label><input type="checkbox" id="bolts" checked> show bolts (off: see the empty holes)</label>
  <div class="hint">Drag to rotate · scroll to zoom · right-drag to pan. Air enters at the top, past the stand plate, spider and motor, then the propeller.<br>Same parameters as duct.scad; motor sizes are not yet measured.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const P = { prop_d: 203.2, tip_gap: 1.0, throat_len: 20, lip_r: 25, lip_out_r: 5, wall: 30, prop_to_mount: 55,
            diff_angle: 10, diff_len: 45, hub_r: 22, pair_a: 19, pair_b: 16, hole_d: 3.2, hub_hole_d: 9, arms_n: 3, arm_w: 8, arm_t: 12, leg_t: 7, leg_bolt_z: 70, arm_angle0: 45 };
const rad = d => d * Math.PI / 180;
const throat_r = P.prop_d / 2 + P.tip_gap;
const diff_len = P.diff_len;
const exit_r = throat_r + diff_len * Math.tan(rad(P.diff_angle));
const outer_exit_r = exit_r + 14.5, outer_r = throat_r + P.wall;
const z_prop = diff_len + P.throat_len / 2, z_lip0 = diff_len + P.throat_len, z_top = z_lip0 + P.lip_r;
const z_mount = z_prop + P.prop_to_mount, leg_r0 = outer_r + 0.3;
const hl = throat_r + P.lip_r;
const arc = (cx, cz, r, a0, a1, n = 30) => Array.from({ length: n + 1 }, (_, i) => {
  const a = rad(a0 + (a1 - a0) * i / n); return [cx + r * Math.cos(a), cz + r * Math.sin(a)]; });
const prof = [[exit_r, 0], [throat_r, diff_len], [throat_r, z_lip0], ...arc(hl, z_lip0, P.lip_r, 180, 90),
              ...arc(hl, z_top - P.lip_out_r, P.lip_out_r, 90, 0), [throat_r + P.wall, z_prop], [outer_exit_r, 0], [exit_r, 0]];

document.getElementById("dims").textContent =
  `tip gap        ${P.tip_gap.toFixed(1)} mm   (throat Ø${(2 * throat_r).toFixed(1)})\n` +
  `lip radius     ${P.lip_r} mm    (${(100 * P.lip_r / (2 * throat_r)).toFixed(1)} % Dt)\n` +
  `wall at disc   ${P.wall} mm    (outer Ø${(2 * (hl + P.lip_out_r)).toFixed(1)})\n` +
  `disc below lip ${(z_top - z_prop).toFixed(0)} mm    (${(100 * (z_top - z_prop) / z_top).toFixed(0)} % of length)\n` +
  `diffuser       ${P.diff_angle}°, ${diff_len} mm, exit Ø${(2 * exit_r).toFixed(1)}\n` +
  `exit/disc area ${((exit_r / (P.prop_d / 2)) ** 2).toFixed(2)}\n` +
  `motor face     ${(z_mount - z_top).toFixed(0)} mm above the lip\n` +
  `length         ${z_top} mm`;

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
const scene = new THREE.Scene();
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
scene.background = new THREE.Color(dark ? 0x111619 : 0xf4f6f7);
const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
camera.position.set(380, 300, 420);
const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(0, 80, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(300, 500, 200); scene.add(sun);

const ductMat = new THREE.MeshStandardMaterial({ color: 0x4a7fa8, metalness: 0.05, roughness: 0.6, side: THREE.DoubleSide });
const pts = prof.map(([r, z]) => new THREE.Vector2(r, z));
let duct;
function buildDuct(cut) {
  if (duct) { scene.remove(duct); duct.children.forEach(c => c.geometry.dispose()); }
  duct = new THREE.Group();
  const phi = cut ? Math.PI * 1.5 : Math.PI * 2;
  duct.add(new THREE.Mesh(new THREE.LatheGeometry(pts, 240, Math.PI * 0.5, phi), ductMat));
  if (cut) {
    const shape = new THREE.Shape(pts.map(p => new THREE.Vector2(p.x, p.y)));
    const capMat = new THREE.MeshStandardMaterial({ color: 0x2d5878, side: THREE.DoubleSide });
    for (const a of [Math.PI * 0.5, Math.PI * 2]) {
      const cap = new THREE.Mesh(new THREE.ShapeGeometry(shape), capMat);
      cap.rotation.y = a - Math.PI / 2; duct.add(cap);
    }
  }
  scene.add(duct);
}
buildDuct(true);

const propDisc = new THREE.Mesh(new THREE.CylinderGeometry(P.prop_d / 2, P.prop_d / 2, 1.5, 120),
  new THREE.MeshStandardMaterial({ color: 0xd9822b, transparent: true, opacity: 0.45 }));
propDisc.position.y = z_prop; scene.add(propDisc);

const mount = new THREE.Group();
const grey = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.7, side: THREE.DoubleSide });
const motor = new THREE.Mesh(new THREE.CylinderGeometry(27.7 / 2, 27.7 / 2, 35, 48), new THREE.MeshStandardMaterial({ color: 0x9aa0a4 }));
motor.position.y = z_mount - 35 / 2; mount.add(motor);
// hub with the AXI 2217 rear-mount holes (4 x M3, pairs 19 and 16 mm apart) and the centre clearance hole
const hubShape = new THREE.Shape(); hubShape.absarc(0, 0, P.hub_r, 0, Math.PI * 2, false);
const hole = (x, y, r) => { const h = new THREE.Path(); h.absarc(x, y, r, 0, Math.PI * 2, true); hubShape.holes.push(h); };
hole(0, 0, P.hub_hole_d / 2);
for (const [x, y] of [[P.pair_a / 2, 0], [-P.pair_a / 2, 0], [0, P.pair_b / 2], [0, -P.pair_b / 2]]) hole(x, y, P.hole_d / 2);
const hub = new THREE.Mesh(new THREE.ExtrudeGeometry(hubShape, { depth: P.arm_t, bevelEnabled: false, curveSegments: 32 }), grey);
hub.rotation.x = -Math.PI / 2; hub.position.y = z_mount; mount.add(hub);
const plate = new THREE.Mesh(new THREE.BoxGeometry(40, 4, 40), new THREE.MeshStandardMaterial({ color: 0x333333, transparent: true, opacity: 0.35 }));
plate.position.y = z_mount + P.arm_t + 2; mount.add(plate);
const boltMat = new THREE.MeshStandardMaterial({ color: 0xc0a040 });
for (const [x, y] of [[P.pair_a / 2, 0], [-P.pair_a / 2, 0], [0, P.pair_b / 2], [0, -P.pair_b / 2]]) {
  const b = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, P.arm_t + 14, 16), boltMat);
  b.position.set(x, z_mount + (P.arm_t + 14) / 2 - 6, -y); b.userData.bolt = true; mount.add(b);
}
const legLen = z_mount + P.arm_t - (P.leg_bolt_z - 8);
for (let i = 0; i < P.arms_n; i++) {
  const a = rad(P.arm_angle0 + i * 360 / P.arms_n);
  const g = new THREE.Group();
  const armLen = leg_r0 + P.leg_t;
  const arm = new THREE.Mesh(new THREE.BoxGeometry(armLen, P.arm_t, P.arm_w), grey);
  arm.position.set(armLen / 2, z_mount + P.arm_t / 2, 0); g.add(arm);
  const leg = new THREE.Mesh(new THREE.BoxGeometry(P.leg_t, legLen, P.arm_w), grey);
  leg.position.set(leg_r0 + P.leg_t / 2, P.leg_bolt_z - 8 + legLen / 2, 0); g.add(leg);
  const screw = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, P.leg_t + 10, 16), new THREE.MeshStandardMaterial({ color: 0xc0a040 }));
  screw.rotation.z = Math.PI / 2; screw.position.set(leg_r0 + P.leg_t / 2 - 5, P.leg_bolt_z, 0); g.add(screw);
  g.rotation.y = a;
  mount.add(g);
}
scene.add(mount);

scene.add(new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), new THREE.Vector3(70, z_mount + 70, 0), 60, 0x333333, 14, 8));
scene.add(new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), new THREE.Vector3(0, -10, 0), 60, 0x333333, 14, 8));

document.getElementById("cut").onchange = e => buildDuct(e.target.checked);
document.getElementById("prop").onchange = e => propDisc.visible = e.target.checked;
document.getElementById("spider").onchange = e => mount.visible = e.target.checked;
document.getElementById("bolts").onchange = e => mount.children.forEach(c => { if (c.userData.bolt) c.visible = e.target.checked; });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
